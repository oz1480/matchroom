name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        working-directory: backend
        run: mvn --batch-mode verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-smoke:
    name: Docker Compose and live-feed smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Validate MediaMTX configuration
        run: docker run --rm -v "$PWD/infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro" bluenviron/mediamtx:1.21.4 --validate-conf=/mediamtx.yml
      - name: Build and start the full stack
        run: docker compose up --build -d
      - name: Verify API, web app, and real media publication
        shell: bash
        run: |
          set -euo pipefail
          feed_pid=""
          cleanup() {
            if [ -n "$feed_pid" ]; then kill "$feed_pid" 2>/dev/null || true; fi
            docker compose logs --no-color
            docker compose down -v
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Backend did not become healthy in 120 seconds"
            exit 1
          fi

          curl --fail --silent http://localhost:3000/ | grep -q "Matchroom"
          cameras="$(curl --fail --silent http://localhost:8080/api/cameras)"
          echo "$cameras" | grep -q '"id":"main"'
          echo "$cameras" | grep -q '"hlsUrl":"http://localhost:8888/cam-main/index.m3u8"'
          echo "$cameras" | grep -q '"whepUrl":"http://localhost:8889/cam-main/whep"'

          ffmpeg -hide_banner -loglevel warning -re             -f lavfi -i testsrc2=size=640x360:rate=25             -f lavfi -i sine=frequency=440:sample_rate=48000             -c:v libx264 -profile:v baseline -level 3.1 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -bf 0             -c:a libopus -b:a 96k -rtsp_transport tcp -f rtsp             rtsp://localhost:8554/cam-main >/tmp/matchroom-ffmpeg.log 2>&1 &
          feed_pid=$!

          stream_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8888/cam-main/index.m3u8 -o /tmp/matchroom-playlist.m3u8; then
              if grep -q '#EXTM3U' /tmp/matchroom-playlist.m3u8; then
                stream_ready=true
                break
              fi
            fi
            sleep 2
          done
          if [ "$stream_ready" != true ]; then
            echo "MediaMTX did not produce an HLS playlist from the RTSP test publisher"
            cat /tmp/matchroom-ffmpeg.log
            exit 1
          fi

          echo "Web app, API, RTSP ingest, and HLS output are responding."
